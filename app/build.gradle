plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nic.lgpower'
    compileSdk 36

    defaultConfig {
        applicationId "com.nic.lgpower"
        minSdk 26
        targetSdk 36
        versionCode 47
        versionName "1.39.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "lgpower.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
        debug {
            // Fester Debug-Keystore damit alle CI-Builds dieselbe Signatur haben
            // und Updates ohne Deinstallation gehen. Datei ist nicht eingecheckt
            // (Standard-Passwort, aber Push-Vorpruefung sperrt .keystore grundsaetzlich);
            // CI entschluesselt sie aus Secret DEBUG_KEYSTORE_B64 in app/debug.keystore.
            // Fehlt die Datei (lokaler Build ohne Keystore, oder Secret fehlt in CI),
            // springt Gradle automatisch auf den auto-generierten Debug-Keystore zurueck.
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Signatur nur setzen wenn die Keystore-Datei existiert, sonst Gradle-Default.
            if (file("debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.android.billingclient:billing:9.1.0'

    implementation 'androidx.activity:activity-compose:1.9.2'
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'

    testImplementation 'junit:junit:4.13.2'
}
