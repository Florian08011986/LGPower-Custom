name: Build Oma Heidi Remote APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Berechtigung für Gradle-Wrapper setzen
        run: chmod +x gradlew

      - name: Kompiliere Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lade fertige APK hoch
        uses: actions/upload-artifact@v4
        with:
          name: OmaHeidisFernbedienung-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
