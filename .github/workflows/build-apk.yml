name: Build & Sign Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Android SDK aufsetzen
        uses: android-actions/setup-android@v3

      - name: Ausführungsrechte für Gradle Wrapper vergeben
        run: chmod +x gradlew

      - name: Unsignierte Release-APK kompilieren
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Keystore aus Secret wiederherstellen
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Release-APK ausrichten und signieren
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          ALIGNED_APK="app/build/outputs/apk/release/app-aligned.apk"
          FINAL_APK="app/build/outputs/apk/release/LGPower-Release-Signed.apk"

          zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          apksigner verify --verbose "$FINAL_APK"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cp "$FINAL_APK" "app/build/outputs/apk/release/LGPower-${{ github.ref_name }}.apk"
          fi

      - name: Keystore aus Runner entfernen
        if: always()
        run: rm -f release.keystore

      - name: Fertige APK als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LGPower-Signed-APK
          path: app/build/outputs/apk/release/LGPower-Release-Signed.apk
          retention-days: 14

      - name: GitHub Release erstellen und APK anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/LGPower-${{ github.ref_name }}.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
